[project]
name = "pldm_parser"
version = "0.1.0"
description = "Parser for PLDM-over-MCTP frames (with Intel sideband prefix)."
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pldm_parser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
